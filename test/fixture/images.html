<!DOCTYPE html>
<!-- This test verifies the loading of the local image relative to the HTML file -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Images Test</title>

    <style>
        @page {
            size: A4;
            margin: 20mm;
        }

        body {
            font-family: sans-serif;
        }

        .image-container {
            margin-top: 20px;
            padding: 10px;
            border: 2px solid #333333;
        }

        img {
            width: 256px;
            height: 256px;
        }
    </style>
</head>

<body>

<h1>Images Integration Test</h1>

<p>
    The following image must be loaded from a relative path.
</p>

<p>
    Image marker: IMAGE_RELATIVE_PATH_TEST
</p>

<div class="image-container">
    <img
        src="image.png"
        alt="Integration test image"
    >
</div>

<p>
    If the image is missing from the resulting PDF, relative resource
    resolution is probably broken.
</p>

</body>
</html>
